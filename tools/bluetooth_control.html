<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>底盘控制</title>
<style>
:root {
  --ink:#172c36;
  --muted:#536873;
  --line:#d4dfe3;
  --paper:#fff;
  --bg:#edf2f3;
  --soft:#e0e9ec;
  --accent:#096b65
}
* {
  box-sizing:border-box
}
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif
}
button,input {
  font:inherit
}
button {
  cursor:pointer;
  touch-action:manipulation
}
button:disabled {
  cursor:default;
  color:#71818a;
  background:#edf1f2;
  border-color:#dce4e6
}
button:focus-visible,input:focus-visible {
  outline:3px solid #168b82;
  outline-offset:3px
}
[hidden] {
  display:none!important
}
main {
  max-width:1160px;
  margin:auto;
  padding:28px 28px 100px
}
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px
}
h1 {
  font-size:26px;
  letter-spacing:-.04em;
  margin:0
}
h2 {
  font-size:16px;
  margin:0
}
.connection-state {
  display:flex;
  gap:9px;
  align-items:center;
  color:var(--muted)
}
.dot {
  width:8px;
  height:8px;
  background:#8a9ba3;
  border-radius:50%
}
.dot.on {
  background:var(--accent)
}
section {
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:12px;
  padding:20px;
  margin-bottom:16px
}
.section-head,.control-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px
}
.connection-panel {
  background:#172c36;
  color:#fff;
  border:0
}
.connection-panel .section-head {
  margin-bottom:12px
}
.segment {
  display:flex;
  gap:4px;
  background:#29414b;
  padding:4px;
  border-radius:8px
}
.segment button {
  min-height:40px;
  padding:6px 16px;
  border:0;
  background:transparent;
  color:#d5e4e8;
  border-radius:5px
}
.segment button[aria-pressed=true] {
  background:#fff;
  color:var(--ink)
}
.connection-row {
  display:flex;
  gap:8px;
  flex-wrap:wrap
}
.button,.mode-button {
  min-height:44px;
  padding:10px 16px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;
  color:var(--ink);
  font-weight:600
}
.button.primary {
  background:#bce7df;
  border-color:#bce7df;
  color:#123f3b
}
.nx-fields {
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:12px;
  margin-bottom:14px
}
.field {
  display:flex;
  flex-direction:column;
  gap:6px;
  font-size:13px;
  color:#d6e4e8
}
.field input {
  min-width:0;
  width:100%;
  min-height:44px;
  padding:9px 12px;
  font-size:16px;
  border:1px solid #69808b;
  border-radius:6px;
  background:#fff;
  color:var(--ink)
}
#info {
  color:#c1d7df;
  font-size:13px;
  margin:12px 0 0;
  overflow-wrap:anywhere
}
.status-grid {
  display:grid;
  grid-template-columns:repeat(4,1fr)
}
.status-item {
  display:flex;
  flex-direction:column;
  gap:5px;
  border-left:1px solid var(--line);
  padding:0 18px
}
.status-item:first-child {
  border:0;
  padding-left:0
}
.status-item span {
  font-size:12px;
  color:var(--muted)
}
.status-item strong {
  font-size:15px
}
.dashboard {
  display:grid;
  grid-template-columns:1.3fr 1fr;
  gap:20px;
  align-items:start
}
.dashboard section {
  margin:0
}
.controls {
  grid-column:1;
  grid-row:1
}
.telemetry {
  grid-column:2;
  grid-row:1
}
.control-surface {
  height:270px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f3f7f7;
  border-radius:8px;
  margin:16px 0 20px
}
.dpad {
  display:grid;
  grid-template-columns:repeat(3,72px);
  grid-template-rows:repeat(3,72px);
  gap:8px;
  touch-action:none
}
.dbtn {
  border:1px solid #c7d7da;
  border-radius:10px;
  background:#fff;
  color:var(--accent);
  font-size:24px;
  touch-action:none;
  user-select:none
}
.dbtn.active {
  background:var(--accent);
  color:#fff
}
.dbtn.stop {
  background:#9d3331;
  color:#fff;
  border:0
}
.dbtn svg {
  width:22px;
  height:22px;
  fill:currentColor;
  display:block;
  margin:auto
}
#stick {
  width:230px;
  height:230px;
  position:relative;
  border:1px solid #b5cccf;
  border-radius:50%;
  background:#e5efef;
  touch-action:none
}
#stick:before {
  content:"";
  position:absolute;
  inset:30px;
  border:1px solid #c3d7d8;
  border-radius:50%
}
#knob {
  position:absolute;
  left:50%;
  top:50%;
  width:68px;
  height:68px;
  margin:-34px;
  border-radius:50%;
  background:var(--accent);
  pointer-events:none
}
.limit-group {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px
}
.limit-head {
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:12px;
  color:var(--muted)
}
.limit-head output {
  color:var(--ink);
  font-variant-numeric:tabular-nums
}
.limit-head small {
  font-size:11px
}
input[type=range] {
  width:100%;
  height:32px;
  accent-color:var(--accent)
}
.control-actions {
  display:flex;
  gap:8px;
  margin-top:14px
}
.control-actions .button {
  flex:1
}
.lift-row {
  display:flex;
  align-items:center;
  gap:8px;
  padding-top:18px;
  margin-top:20px;
  border-top:1px solid var(--line)
}
.lift-label {
  margin-right:auto;
  font-weight:600
}
.lift-btn {
  min-width:56px
}
.metrics {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px 20px
}
.metric.voltage {
  grid-column:1/-1;
  padding-bottom:24px;
  border-bottom:1px solid var(--line)
}
.metric-head {
  font-size:13px;
  color:var(--muted);
  margin-bottom:10px
}
.reading {
  font-size:28px;
  font-weight:600;
  line-height:1.2;
  font-variant-numeric:tabular-nums
}
.metric.voltage .reading {
  font-size:44px
}
.reading small {
  font-size:12px;
  font-weight:400;
  color:var(--muted);
  margin-left:6px
}
.track {
  height:5px;
  background:var(--soft);
  border-radius:3px;
  margin-top:12px;
  position:relative;
  overflow:hidden
}
.track i {
  position:absolute;
  left:0;
  top:0;
  height:100%;
  background:var(--accent)
}
.track.signed:after {
  content:"";
  position:absolute;
  left:50%;
  height:100%;
  width:1px;
  background:#94aeb4
}
.track.signed i {
  left:50%
}
footer {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  border-top:1px solid var(--line);
  padding:12px max(20px,calc((100vw - 1104px)/2));
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  z-index:5;
  color:var(--muted);
  font-size:12px
}
.stop-all {
  background:#9d3331;
  color:#fff;
  border:0;
  border-radius:7px;
  min-height:48px;
  padding:10px 30px;
  font:600 15px system-ui
}
body.connected #nxFields,body.connected #btnConnect,body.connected #btnScanAll {
  display:none!important
}
@media(max-width:760px) {
  main {
    padding:18px 14px 100px
  }
  header {
    margin-bottom:18px
  }
  h1 {
    font-size:23px
  }
  section {
    padding:16px;
    margin-bottom:12px
  }
  .dashboard {
    display:flex;
    flex-direction:column;
    gap:12px
  }
  .dashboard section {
    width:100%
  }
  .controls {
    order:0
  }
  .telemetry {
    order:1
  }
  .status-item {
    padding:0 8px
  }
  .status-item strong {
    font-size:13px;
    overflow-wrap:anywhere
  }
  .control-surface {
    height:238px
  }
  .dpad {
    grid-template-columns:repeat(3,64px);
    grid-template-rows:repeat(3,64px);
    gap:8px
  }
  .connection-row .button {
    flex:1;
    padding:9px 10px;
    font-size:13px
  }
  .segment button {
    padding:6px 11px
  }
  .nx-fields {
    grid-template-columns:1fr
  }
  .limit-group {
    gap:14px
  }
  .reading {
    font-size:25px
  }
  .metric.voltage .reading {
    font-size:36px
  }
  footer {
    padding:10px 14px max(10px,env(safe-area-inset-bottom))
  }
  .stop-all {
    padding:10px 24px
  }
  .control-head {
    margin-bottom:10px
  }
  .lift-row {
    margin-top:14px;
    padding-top:14px
  }
}
@media(prefers-reduced-motion:reduce) {
  * {
    scroll-behavior:auto!important
  }
}
.connection-panel  {
  margin-bottom: 12px;
  border-radius: 10px;
}
.connection-panel summary  {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 52px;
  padding: 12px 18px;
  cursor: pointer;
  font-weight: 600;
}
.connection-panel summary span  {
  color: #bdd2da;
  font-size: 12px;
  font-weight: 400;
}
.connection-panel summary::after  {
  content: "+";
  margin-left: 12px;
  font-size: 20px;
}
.connection-panel[open] summary::after  {
  content: "−";
}
.connection-panel summary:focus-visible  {
  outline: 3px solid #168b82;
  outline-offset: 3px;
}
.connection-panel section  {
  background: transparent;
  color: inherit;
  border: 0;
  margin: 0;
  padding-top: 4px;
}
.status-panel  {
  padding: 14px 18px;
}
.status-panel .section-head  {
  margin-bottom: 8px;
}
.status-panel h2  {
  font-size: 13px;
}
.status-item  {
  gap: 2px;
}
@media (max-width: 760px)  {
  header  {
    margin-bottom: 12px;
  }
  .status-panel  {
    padding: 10px 14px;
  }
  .status-panel .section-head  {
    margin-bottom: 6px;
  }
  .control-surface  {
    height: 220px;
    margin: 10px 0 14px;
  }
  .control-actions  {
    margin-top: 8px;
  }
  .lift-row  {
    margin-top: 10px;
    padding-top: 10px;
  }
}
</style>
</head>
<body>
<main>
<header><h1>底盘控制</h1><div class="connection-state" role="status"><i id="dot" class="dot"></i><span id="conn">未连接</span></div></header>
<details class="connection-panel"><summary>连接设备 <span>蓝牙 / Jetson NX</span></summary><section aria-labelledby="connect-heading">
<div class="section-head"><h2 id="connect-heading">连接</h2><div class="segment" aria-label="连接方式"><button id="modeBle" aria-pressed="true">蓝牙</button><button id="modeNx" aria-pressed="false">Jetson NX</button></div></div>
<div id="nxFields" class="nx-fields" hidden><label class="field">设备地址<input id="nxAddress" autocomplete="url" placeholder="192.168.31.50:8765" spellcheck="false"></label><label class="field">连接口令<input id="nxToken" type="password" autocomplete="off" placeholder="可选"></label></div>
<div class="connection-row"><button id="btnConnect" class="button primary">连接蓝牙</button><button id="btnScanAll" class="button">查找设备</button><button id="btnDisconnect" class="button" disabled>断开连接</button></div>
<p id="info" role="status">选择设备后连接</p>
</section></details>
<section class="status-panel" aria-labelledby="status-heading"><div class="section-head"><h2 id="status-heading">状态</h2><span id="ownerLabel" style="font-size:11px;color:var(--muted)">无人控制</span></div><div class="status-grid"><div class="status-item"><span>控制</span><strong id="controlState">未就绪</strong></div><div class="status-item"><span>使能</span><strong id="enableState">—</strong></div><div class="status-item"><span>电源</span><strong id="powerState">—</strong></div><div class="status-item"><span>反馈</span><strong id="feedbackState">等待连接</strong></div></div></section>
<div class="dashboard">
<section class="telemetry" aria-labelledby="parameter-heading"><div class="section-head"><h2 id="parameter-heading">运行反馈</h2><span id="feedbackAge" style="font-size:11px;color:var(--muted)">等待更新</span></div><div class="metrics">
<div class="metric voltage"><div class="metric-head">电压</div><div class="reading"><span id="volt">—</span><small>V</small></div><div class="track"><i id="vbar"></i></div></div>
<div class="metric"><div class="metric-head">左轮速度</div><div class="reading"><span id="lval">—</span><small>mm/s</small></div><div class="track signed"><i id="lbar"></i></div></div>
<div class="metric"><div class="metric-head">右轮速度</div><div class="reading"><span id="rval">—</span><small>mm/s</small></div><div class="track signed"><i id="rbar"></i></div></div>
<div class="metric"><div class="metric-head">前进指令</div><div class="reading"><span id="cmdv">0</span><small>mm/s</small></div><div class="track signed"><i id="cvbar"></i></div></div>
<div class="metric"><div class="metric-head">转向指令</div><div class="reading"><span id="cmdw">0</span><small>mrad/s</small></div><div class="track signed"><i id="cwbar"></i></div></div>
</div></section>
<section class="controls" aria-labelledby="control-heading"><div class="control-head"><h2 id="control-heading">底盘操控</h2><button id="btnControlMode" class="mode-button" aria-pressed="false">切换摇杆</button></div>
<div class="control-surface"><div class="dpad" id="dpad"><span></span><button class="dbtn" data-jx="0" data-jy="-1" aria-label="前进"><svg viewBox="0 0 24 24"><path d="m12 5 9 13H3Z"/></svg></button><span></span><button class="dbtn" data-jx="-1" data-jy="0" aria-label="左转"><svg viewBox="0 0 24 24"><path d="m5 12 13-9v18Z"/></svg></button><button class="dbtn stop" data-stop="1" aria-label="停止">■</button><button class="dbtn" data-jx="1" data-jy="0" aria-label="右转"><svg viewBox="0 0 24 24"><path d="m19 12-13 9V3Z"/></svg></button><span></span><button class="dbtn" data-jx="0" data-jy="1" aria-label="后退"><svg viewBox="0 0 24 24"><path d="m12 19-9-13h18Z"/></svg></button><span></span></div><div id="stick" hidden aria-label="方向摇杆"><div id="knob"></div></div></div>
<div class="limit-group"><label class="limit"><span class="limit-head"><span>前进上限</span><span><output id="maxvv">600</output> <small>mm/s</small></span></span><input id="maxv" type="range" min="30" max="600" step="10" value="600" aria-label="前进速度上限"></label><label class="limit"><span class="limit-head"><span>转向上限</span><span><output id="maxwv">400</output> <small>mrad/s</small></span></span><input id="maxw" type="range" min="100" max="400" step="25" value="400" aria-label="转向速度上限"></label></div>
<div class="control-actions"><button id="btnRelease" class="button" disabled>释放控制</button><button id="btnRearm" class="button" disabled>申请控制</button></div>
<div class="lift-row" id="liftRow"><span class="lift-label">升降</span><button id="btnLiftUp" class="button lift-btn" aria-label="平台上升" disabled>升</button><button id="btnLiftDown" class="button lift-btn" aria-label="平台下降" disabled>降</button><button id="btnLiftStop" class="button lift-btn" aria-label="平台刹停" disabled>停</button></div>
</section>
</div>
<footer><span>按住行驶 · 松开即停</span><button class="stop-all" id="stopAll">停止行驶</button></footer>
</main>
<script>
"use strict";
document.getElementById("stopAll").addEventListener("click",function(){stopHeld();});
var $=function(id){return document.getElementById(id);};
var SVC_UUID="0000ffe0-0000-1000-8000-00805f9b34fb",MAXV=600,MAXW=400;
var mode='ble',connected=false,connecting=false,paused=true,claimed=false,jx=0,jy=0,maxV=600,maxW=400;
var device=null,writeChar=null,notifyChar=null,socket=null,connectionEpoch=0,seq=0,latestLease=null,latestLeaseAt=0,blePending=null,bleWriting=false,bleDrain=null;
var owner=0,ownerStatus=0,statusByte=0,lastRxAt=0,ownerAt=0,fresh=false,ready=false,enabled=false,rxBuf=new Uint8Array(0),keys={},heldPointer=null,stickOn=false;
var metricTarget={v:0,l:0,r:0,cv:0,cw:0,ax:0,ay:0,az:0,gx:0,gy:0,gz:0},metricView=Object.assign({},metricTarget),hasTelemetry=false,hasImu=false,lastNumberAt=0,lastAnimation=0;
var liftCmd=0,liftHeld=null;
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function setInfo(s){$('info').textContent=s;}
function now(){return performance.now();}
function feedbackFresh(){return hasTelemetry&&fresh&&now()-lastRxAt<650;}
function canDrive(){return connected&&!paused&&claimed&&ready&&enabled&&feedbackFresh()&&(mode!=='ble'||now()-ownerAt<650)&&(mode==='ble'||(latestLease&&now()-latestLeaseAt<250))&&owner===(mode==='ble'?4:3)&&!(statusByte&0xce)&&!!(statusByte&1)&&!!(statusByte&32);}
function renderStatus(){document.body.classList.toggle('connected',connected);var f=feedbackFresh(),ok=canDrive();$('dot').className='dot'+(connected?' on':'');$('conn').textContent=connecting?'连接中':connected?(mode==='ble'?'蓝牙已连接':'NX 已连接'):'未连接';$('controlState').textContent=!connected?'未就绪':paused?'已释放':ok?'可控制':'等待就绪';$('enableState').textContent=f?((statusByte&32)?'已开启':'已关闭'):'—';$('powerState').textContent=f?((statusByte&64)?'电量偏低':'正常'):'—';$('feedbackState').textContent=!connected?'等待连接':f?'正常':'等待更新';$('feedbackAge').textContent=f?'实时更新':'等待更新';$('ownerLabel').textContent=f?({0:'无人控制',3:'NX 控制',4:'蓝牙控制'}[owner]||'等待就绪'):'无人控制';$('btnConnect').disabled=connected||connecting;$('btnScanAll').disabled=connected||connecting;$('btnDisconnect').disabled=!connected&&!connecting;$('btnRelease').disabled=!connected||paused;$('btnRearm').disabled=!connected||(!paused&&claimed);document.querySelectorAll('.dbtn:not(.stop)').forEach(function(b){b.disabled=!ok;});$('stick').setAttribute('aria-disabled',String(!ok));var liftOk=ok&&mode==='ble';['btnLiftUp','btnLiftDown','btnLiftStop'].forEach(function(id){$(id).disabled=!liftOk;});}
function clearGesture(){jx=jy=0;keys={};heldPointer=null;stickOn=false;liftCmd=0;liftHeld=null;$('knob').style.transform='translate(0,0)';document.querySelectorAll('.dbtn.active,.lift-btn.active').forEach(function(b){b.classList.remove('active');});metricTarget.cv=metricTarget.cw=0;}
function buildFrame(vx,wz,lift,release){var b=new Uint8Array(11);b[0]=0x7b;b[1]=release?0x10:0;b[3]=(vx>>8)&255;b[4]=vx&255;b[5]=(lift>>8)&255;b[6]=lift&255;b[7]=(wz>>8)&255;b[8]=wz&255;for(var i=0;i<9;i++)b[9]^=b[i];b[10]=0x7d;return b;}
// At most one write and one replacement; queued movement is never replayed.
function bleWrite(bytes){if(!writeChar)return Promise.resolve();blePending={bytes:bytes,epoch:connectionEpoch,at:now()};if(bleWriting)return bleDrain;bleWriting=true;bleDrain=(async function(){try{while(blePending){var item=blePending;blePending=null;var characteristic=writeChar;if(!characteristic||item.epoch!==connectionEpoch||now()-item.at>150)continue;var buf=item.bytes.buffer.slice(item.bytes.byteOffset,item.bytes.byteOffset+item.bytes.byteLength);if(characteristic.properties&&characteristic.properties.writeWithoutResponse)await characteristic.writeValueWithoutResponse(buf);else await characteristic.writeValue(buf);}}catch(e){blePending=null;clearGesture();paused=true;claimed=false;setInfo('连接异常，请重新连接');}finally{bleWriting=false;renderStatus();}})();return bleDrain;}
function wsSend(data){if(socket&&socket.readyState===1&&socket.bufferedAmount===0){socket.send(JSON.stringify(data));return true;}return false;}
function sendCommand(vx,wz,lift){metricTarget.cv=vx;metricTarget.cw=wz;if(mode==='ble')bleWrite(buildFrame(vx,wz,lift||0,false));else if(!latestLease||!wsSend({type:'cmd',seq:++seq,vx:vx,wz:wz,lease:latestLease})){clearGesture();}}
function stopHeld(){clearGesture();blePending=null;if(connected&&!paused&&claimed)sendCommand(0,0,0);}
function resetFeedback(){owner=0;ownerStatus=statusByte=0;lastRxAt=ownerAt=0;latestLease=null;latestLeaseAt=0;fresh=ready=enabled=hasTelemetry=hasImu=false;rxBuf=new Uint8Array(0);Object.keys(metricTarget).forEach(function(k){metricTarget[k]=metricView[k]=0;});}
async function releaseControl(){clearGesture();blePending=null;var oldMode=mode;paused=true;claimed=false;renderStatus();if(!connected)return;if(oldMode==='ble'){await bleWrite(buildFrame(0,0,0,false));await bleWrite(buildFrame(0,0,0,true));setInfo('已释放控制');}else{if(!wsSend({type:'release'})){if(socket)socket.close();setInfo('连接已关闭');}}}

function socketAddress(value){value=value.trim();if(!value)throw new Error('请填写设备地址');var explicitScheme=/^[a-z]+:\/\//i.test(value);if(!explicitScheme)value=(location.protocol==='https:'?'wss://':'ws://')+value;var u=new URL(value);if(u.protocol==='http:')u.protocol='ws:';if(u.protocol==='https:')u.protocol='wss:';if(!['ws:','wss:'].includes(u.protocol)||u.username||u.password||u.search||u.hash)throw new Error('请检查设备地址');if(location.protocol==='https:'&&u.protocol!=='wss:')throw new Error('请使用安全地址，或在 NX 页面连接');if(!u.port&&!explicitScheme)u.port='8765';if(u.pathname==='/'||!u.pathname)u.pathname='/ws';return u.href;}
function connectNx(){var url;try{url=socketAddress($('nxAddress').value);}catch(e){setInfo(e.message);return;}connecting=true;paused=true;claimed=false;resetFeedback();clearGesture();renderStatus();var epoch=++connectionEpoch,ws=new WebSocket(url);socket=ws;var connectTimer=setTimeout(function(){if(epoch===connectionEpoch&&connecting){ws.close();setInfo('连接超时，请检查地址');}},8000);ws.onopen=function(){if(epoch!==connectionEpoch)return;ws.send(JSON.stringify({type:'auth',token:$('nxToken').value}));};ws.onmessage=function(e){if(epoch!==connectionEpoch)return;var d;try{d=JSON.parse(e.data);}catch(x){return;}if(d.type==='hello'){clearTimeout(connectTimer);connected=true;connecting=false;seq=0;wsSend({type:'claim'});setInfo('正在申请控制');}else if(d.type==='claimed'){latestLease=typeof d.lease==='string'?d.lease:null;latestLeaseAt=now();claimed=true;paused=false;clearGesture();setInfo('已连接，按住方向键控制');}else if(d.type==='released'){claimed=false;paused=true;clearGesture();setInfo('已释放控制');}else if(d.type==='telemetry'){latestLease=typeof d.lease==='string'?d.lease:null;latestLeaseAt=now();applyNxTelemetry(d);}else if(d.type==='error'){clearGesture();claimed=false;paused=true;setInfo(d.message||'暂时无法控制');}renderStatus();};ws.onerror=function(){if(epoch===connectionEpoch)setInfo('连接失败，请检查设备地址');};ws.onclose=function(){clearTimeout(connectTimer);if(epoch!==connectionEpoch)return;connected=connecting=claimed=false;paused=true;socket=null;clearGesture();resetFeedback();renderStatus();};}
async function connectBle(allDevices){
  if(!navigator.bluetooth){setInfo('此浏览器无法连接蓝牙，可选择 NX');return;}
  connecting=true;renderStatus();var epoch=++connectionEpoch;

    var options=allDevices?{acceptAllDevices:true,optionalServices:[SVC_UUID]}:{filters:[{services:[SVC_UUID]},{namePrefix:'JDY'}],optionalServices:[SVC_UUID]};

    var svc=await server.getPrimaryService(SVC_UUID),chars=await svc.getCharacteristics();
    if(epoch!==connectionEpoch){server.disconnect();return;}
    var writer=chars.find(function(c){return c.uuid.toLowerCase().indexOf('ffe1')>=0&&(c.properties.write||c.properties.writeWithoutResponse);})||chars.find(function(c){return c.properties.write||c.properties.writeWithoutResponse;});
    var notifier=chars.find(function(c){return c.uuid.toLowerCase().indexOf('ffe2')>=0&&(c.properties.notify||c.properties.indicate);})||chars.find(function(c){return c.properties.notify||c.properties.indicate;});
    if(!writer||!notifier)throw new Error('无法连接此设备');

    writeChar=writer;notifyChar=notifier;
    notifier.addEventListener('characteristicvaluechanged',function(e){if(epoch===connectionEpoch&&mode==='ble')onNotify(e);});

    await bleWrite(buildFrame(0,0,0,false));if(epoch===connectionEpoch)setInfo(chosen.name||'蓝牙已连接');

    if(epoch!==connectionEpoch)return;
    connecting=connected=claimed=false;paused=true;
    try{if(device&&device.gatt.connected)device.gatt.disconnect();}catch(x){}
    writeChar=notifyChar=null;setInfo(e.name==='NotFoundError'?'未选择设备':'连接失败，请重试');
  }

}
function xorN(a,n){var v=0;for(var i=0;i<n;i++)v^=a[i];return v;}
function u16(a,o){return(a[o]<<8)|a[o+1];}function s16(a,o){var n=u16(a,o);return n>32767?n-65536:n;}
function onNotify(e){var dv=e.target.value,v=new Uint8Array(dv.buffer,dv.byteOffset,dv.byteLength),m=new Uint8Array(rxBuf.length+v.length);m.set(rxBuf);m.set(v,rxBuf.length);rxBuf=m;while(rxBuf.length){var n=rxBuf[0]===0x5a?22:rxBuf[0]===0x5b?6:0;if(!n){rxBuf=rxBuf.slice(1);continue;}if(rxBuf.length<n)break;var f=rxBuf.slice(0,n);if(f[n-1]!==(n===22?0xa5:0xa6)||xorN(f,n-2)!==f[n-2]){rxBuf=rxBuf.slice(1);continue;}rxBuf=rxBuf.slice(n);if(n===22)applyTelem(f);else applyOwner(f);}if(rxBuf.length>128)rxBuf=rxBuf.slice(-32);}
function applyTelem(f){if(f.length!==22||f[21]!==0xa5||xorN(f,20)!==f[20])return;statusByte=f[1];metricTarget.v=u16(f,6)/1000;metricTarget.l=s16(f,2);metricTarget.r=s16(f,4);['ax','ay','az'].forEach(function(k,i){metricTarget[k]=s16(f,8+i*2);});['gx','gy','gz'].forEach(function(k,i){metricTarget[k]=s16(f,14+i*2);});lastRxAt=now();fresh=hasTelemetry=hasImu=true;enabled=!!(statusByte&32);ready=owner===4&&ownerStatus===1;if(!canDrive())clearGesture();renderStatus();}
function applyOwner(f){if(f.length!==6||f[5]!==0xa6||xorN(f,4)!==f[4]||f[1]!==1)return;owner=f[2];ownerStatus=f[3];ownerAt=now();ready=owner===4&&ownerStatus===1;if(!canDrive())clearGesture();renderStatus();}
function applyNxTelemetry(d){var nums=['voltage_v','left_mps','right_mps'];if(!nums.every(function(k){return typeof d[k]==='number'&&Number.isFinite(d[k]);})||!Number.isInteger(d.owner)||!Number.isInteger(d.status))return;owner=d.owner;ownerStatus=d.state;statusByte=d.status;ready=d.ready===true;enabled=d.enabled===true;fresh=d.fresh===true;lastRxAt=now();hasTelemetry=true;metricTarget.v=d.voltage_v;metricTarget.l=d.left_mps*1000;metricTarget.r=d.right_mps*1000;hasImu=Array.isArray(d.acc)&&Array.isArray(d.gyro)&&d.acc.length===3&&d.gyro.length===3&&d.acc.concat(d.gyro).every(Number.isFinite);if(hasImu){['ax','ay','az'].forEach(function(k,i){metricTarget[k]=d.acc[i];});['gx','gy','gz'].forEach(function(k,i){metricTarget[k]=d.gyro[i];});}if(!canDrive())clearGesture();}
function tickSend(){if(!connected||paused||!claimed)return;if(document.hidden){clearGesture();return;}if(!canDrive())clearGesture();var ok=canDrive(),vx=ok?clamp(Math.round(-jy*maxV),-MAXV,MAXV):0,wz=ok?clamp(Math.round(-jx*maxW),-MAXW,MAXW):0;sendCommand(vx,wz,ok?liftCmd:0);}
function rearm(){clearGesture();blePending=null;if(!connected)return;if(mode==='ble'){paused=false;claimed=true;bleWrite(buildFrame(0,0,0,false));}else{paused=true;claimed=false;wsSend({type:'claim'});}renderStatus();}
var stick=$('stick');function jmove(e){if(!canDrive())return;var r=stick.getBoundingClientRect(),dx=(e.clientX-r.left-r.width/2)/(r.width/2),dy=(e.clientY-r.top-r.height/2)/(r.height/2),m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m;}$('knob').style.transform='translate('+(dx*61)+'px,'+(dy*61)+'px)';jx=dx;jy=dy;}
stick.addEventListener('pointerdown',function(e){if(!canDrive()||heldPointer!==null)return;e.preventDefault();heldPointer=e.pointerId;stickOn=true;stick.setPointerCapture(e.pointerId);jmove(e);});stick.addEventListener('pointermove',function(e){if(stickOn&&heldPointer===e.pointerId)jmove(e);});['pointerup','pointercancel','lostpointercapture'].forEach(function(n){stick.addEventListener(n,function(e){if(heldPointer===e.pointerId)stopHeld();});});
document.querySelectorAll('.dpad button').forEach(function(b){b.addEventListener('pointerdown',function(e){e.preventDefault();if(b.dataset.stop){stopHeld();return;}if(!canDrive()||heldPointer!==null)return;heldPointer=e.pointerId;b.setPointerCapture(e.pointerId);b.classList.add('active');jx=+b.dataset.jx;jy=+b.dataset.jy;});['pointerup','pointercancel','lostpointercapture'].forEach(function(n){b.addEventListener(n,function(e){if(heldPointer===e.pointerId)stopHeld();});});});
document.querySelectorAll('.lift-btn').forEach(function(b){b.addEventListener('pointerdown',function(e){e.preventDefault();if(!canDrive()||mode!=='ble'||liftHeld!==null)return;liftHeld=e.pointerId;b.setPointerCapture(e.pointerId);b.classList.add('active');liftCmd=b.id==='btnLiftUp'?400:b.id==='btnLiftDown'?-400:0;});['pointerup','pointercancel','lostpointercapture'].forEach(function(n){b.addEventListener(n,function(e){if(liftHeld===e.pointerId){liftHeld=null;liftCmd=0;b.classList.remove('active');}});});});
var KM={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};function fromKeys(){jx=jy=0;Object.keys(keys).forEach(function(k){jx+=KM[k][0];jy+=KM[k][1];});jx=clamp(jx,-1,1);jy=clamp(jy,-1,1);}
document.addEventListener('keydown',function(e){if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();stopHeld();return;}if(KM[e.code]){e.preventDefault();if(e.repeat)return;if(canDrive()&&heldPointer===null){keys[e.code]=1;fromKeys();}}});document.addEventListener('keyup',function(e){if(KM[e.code]){delete keys[e.code];fromKeys();if(!jx&&!jy)stopHeld();}});
['blur','pagehide'].forEach(function(n){window.addEventListener(n,stopHeld);});document.addEventListener('visibilitychange',function(){if(document.hidden){stopHeld();if(mode==='nx'&&connected)releaseControl();}});
$('modeBle').onclick=function(){selectMode('ble');};$('modeNx').onclick=function(){selectMode('nx');};$('btnConnect').onclick=function(){mode==='ble'?connectBle(false):connectNx();};$('btnScanAll').onclick=function(){connectBle(true);};$('btnDisconnect').onclick=disconnect;$('btnRelease').onclick=releaseControl;$('btnRearm').onclick=rearm;$('btnControlMode').onclick=function(){stopHeld();var joystick=$('stick').hidden;$('stick').hidden=!joystick;$('dpad').hidden=joystick;this.textContent=joystick?'切换方向键':'切换摇杆';this.setAttribute('aria-pressed',String(joystick));};$('maxv').oninput=function(e){maxV=clamp(+e.target.value,30,MAXV);$('maxvv').textContent=maxV;};$('maxw').oninput=function(e){maxW=clamp(+e.target.value,100,MAXW);$('maxwv').textContent=maxW;};
function drawBar(id,value,limit,signed){var pct=clamp(value/limit,signed?-1:0,1)*(signed?50:100),bar=$(id);bar.style.width=Math.abs(pct)+'%';bar.style.left=signed?(pct<0?50+pct:50)+'%':'0';}
function renderMetrics(ts){var dt=Math.min(100,ts-lastAnimation||16);lastAnimation=ts;var alpha=matchMedia('(prefers-reduced-motion: reduce)').matches?1:1-Math.exp(-dt/130);Object.keys(metricTarget).forEach(function(k){metricView[k]+=(metricTarget[k]-metricView[k])*alpha;});var live=feedbackFresh();drawBar('vbar',live?metricView.v:0,28,false);drawBar('lbar',live?metricView.l:0,MAXV,true);drawBar('rbar',live?metricView.r:0,MAXV,true);drawBar('cvbar',metricView.cv,MAXV,true);drawBar('cwbar',metricView.cw,MAXW,true);if(ts-lastNumberAt>=250){lastNumberAt=ts;var f=feedbackFresh();$('volt').textContent=f?metricView.v.toFixed(1):'—';$('lval').textContent=f?Math.round(metricView.l/5)*5:'—';$('rval').textContent=f?Math.round(metricView.r/5)*5:'—';$('cmdv').textContent=Math.round(metricView.cv);$('cmdw').textContent=Math.round(metricView.cw);renderStatus();}requestAnimationFrame(renderMetrics);}
