name: Deploy Pages

# 发布 tools/ 目录为 GitHub Pages 站点（含安卓 Web Bluetooth 控制页）。
# 首次运行会用仓库令牌自动开启 Pages（enablement: true）。

on:
  push:
    branches: [Eggy]
    paths:
      - 'tools/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: tools
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
